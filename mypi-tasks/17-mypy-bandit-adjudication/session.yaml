      message.

  - id: "recorder"
    title: "Reconcile the verdict sets and decide whether mypy and bandit earn slots"
    model: "commandcode/z-ai/glm-5.3-flashx"
    permissions: { read: true, edit: false, shell: false }
    max_cost_usd: 0.20
    max_tokens: 6000000
    system_prompt: |
      Two readers judged the same 61 sampled `mypy` and `bandit` findings on this repository, each
      covering all 61 rows, without seeing each other's work. The supervisor has written both
      replies to run-details/adjudication/<agent-id>.json. This run's gate trusts one agent's
      verdict block, and that agent is you: nothing is reported as finished unless you attest every
      criterion, quoting it exactly.

      You receive both verdict arrays, fixtures/findings.json, fixtures/sample.json,
      fixtures/supplementary/README.md and the raw outputs under fixtures/raw/ and
      fixtures/supplementary/. You own the reconciliation and the per-cohort table.

      Do five things, in this order. First, per id, check the claim against the code at the cited
      line and against the named construct: a verdict that says `present` without naming the
      construct at that line is unsupported — mark it so rather than correcting it silently.
      Second, report per cohort the counts on validity, actionability and consequence, labelling
      any cohort under 5 adjudications an anecdote with no rate. Third, decide `bandit/B101` as one
      class: 678 of bandit's 739 rows are `assert_used` in test files, the five sampled rows are a
      sample of one construct, and the question is whether an `assert` in a test suite is a finding
      at all — answer it once, on the code, not per row. Fourth, where the two readers disagree, say
      which the code supports and why; a restatement of the rule is not a resolution. Fifth, state
      that mypy's collector run stops at `scripts/v1_concurrency_test.py:6` with 3 syntax
      diagnostics, so the 28-row type frame exists only because that one file was excluded for the
      measurement, and name the exclusion as declared rather than silent.

      Two failure modes from earlier runs. Metric-literalism: accepting a rule's claim because the
      message says so, when the cited line does not contain the construct. And invented evidence:
      quoting a line that does not exist or does not contain the expression.

      Finish with a fenced JSON array containing one object per criterion below, each with the keys
      criterion, result (pass or fail), evidence. Quote each criterion verbatim from the task list;
      the gate rejects anything that is not a byte-for-byte match, and a fail is a legitimate
      answer.
